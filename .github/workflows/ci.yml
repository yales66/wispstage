name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Host capabilities
        run: swift .github/scripts/host-capabilities.swift

      - name: Plugin manifests
        run: |
          jq -e '.name and .version' .claude-plugin/plugin.json
          jq -e '.plugins | length > 0' .claude-plugin/marketplace.json
          bash -n bin/wispstage

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
