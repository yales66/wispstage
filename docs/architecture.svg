<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 910" width="1540" height="910" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444"/></marker></defs>
<rect width="1540" height="910" fill="#ffffff"/>
<rect x="380" y="140" width="460" height="646" rx="6" fill="#f7f7f7" stroke="#8a8a8a"/>
<path d="M380 170H840" stroke="#8a8a8a"/>
<text x="390.0" y="159.7" font-size="13" text-anchor="start" fill="#222" font-weight="700">Driver process (your scenario package + WispstageKit)</text>
<rect x="1080" y="296" width="420" height="436" rx="6" fill="#f7f7f7" stroke="#8a8a8a"/>
<path d="M1080 326H1500" stroke="#8a8a8a"/>
<text x="1090.0" y="315.7" font-size="13" text-anchor="start" fill="#222" font-weight="700">Test host process (level 2: a separate target in your project)</text>
<rect x="400" y="296" width="420" height="410" rx="6" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.4"/>
<path d="M400 324H820" stroke="#6c8ebf"/>
<text x="410.0" y="314.5" font-size="12.5" text-anchor="start" fill="#222" font-weight="700">Each step of your scenario</text>
<polyline points="280,227 420,227" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="165,262 165,540" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="770,190 770,110" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
<polyline points="610,264 610,296" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,378 610,400" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,438 610,460" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="610,498 610,520" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="420,605 290,605" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="420,746 165,746 165,670" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="1290,638 1290,666" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="820,366 1100,366" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="820,414 1100,414" fill="none" stroke="#444" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<polyline points="820,462 1100,462" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
<polyline points="820,536 1100,536" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<polyline points="820,600 1100,600" fill="none" stroke="#444" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
<polyline points="1100,690 820,690" fill="none" stroke="#444" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="360" y="30" width="500" height="80" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="610.0" y="58.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="700">~/Library/Caches/wispstage/</tspan><tspan> lock files, shared by every checkout</tspan></text>
<text x="610.0" y="74.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">background: one per bundle ID (exclusive) + the global one (shared)</text>
<text x="610.0" y="90.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">foreground: the global one (exclusive)</text>
<rect x="50" y="192" width="230" height="70" rx="9" fill="#1e3a5f" stroke="#1e3a5f" stroke-width="1.4"/>
<text x="165.0" y="223.5" font-size="12.5" text-anchor="middle" fill="#ffffff" font-weight="700">You or your coding agent</text>
<text x="165.0" y="239.5" font-size="12.5" text-anchor="middle" fill="#ffffff">wispstage run [filter]</text>
<path d="M40 540H276L290 554V670H40Z" fill="#d5e8d4" stroke="#82b366" stroke-width="1.4"/>
<path d="M276 540V554H290" fill="none" stroke="#82b366" stroke-width="1.4"/>
<text x="165.0" y="569.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">build/e2e-runs/&lt;time&gt;/</text>
<text x="165.0" y="585.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">summary.txt, results.json</text>
<text x="165.0" y="601.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">per scenario: steps.log, screenshots,</text>
<text x="165.0" y="617.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">element crops, UI text listings,</text>
<text x="165.0" y="633.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">baseline diffs, events.jsonl,</text>
<text x="165.0" y="649.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">app-stderr.log</text>
<rect x="420" y="190" width="380" height="74" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="610.0" y="215.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">Runner</text>
<text x="610.0" y="231.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">for each scenario: take the lock, run it,</text>
<text x="610.0" y="247.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">then compare its screenshots with the baselines</text>
<rect x="420" y="340" width="380" height="38" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="610.0" y="363.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">1  Act: launch, click, type, press a key, send a command</text>
<rect x="420" y="400" width="380" height="38" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="610.0" y="423.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">2  Wait until the UI stops changing</text>
<rect x="420" y="460" width="380" height="38" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="610.0" y="483.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">3  Read the UI tree and capture the windows</text>
<rect x="420" y="520" width="380" height="170" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="432.0" y="561.5" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="700">4  Checks on every window</text>
<text x="432.0" y="577.5" font-size="12.5" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="700">Fail the step:</tspan><tspan> crash or hang, truncated text,</tspan></text>
<text x="432.0" y="593.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">overlapping or out-of-window text, placeholders,</text>
<text x="432.0" y="609.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">plural errors, beeps, the app taking key focus</text>
<text x="432.0" y="625.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">or coming to the front</text>
<text x="432.0" y="641.5" font-size="12.5" text-anchor="start" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="700">Listed for review:</tspan><tspan> low contrast, small click targets,</tspan></text>
<text x="432.0" y="657.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">misaligned items, missing identifiers, covered text</text>
<rect x="420" y="726" width="380" height="40" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="610.0" y="750.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">After the last scenario: write summary.txt and results.json</text>
<rect x="1100" y="340" width="380" height="140" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="1290.0" y="406.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">Your app code</text>
<text x="1290.0" y="422.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">the same code as your release app, unchanged</text>
<rect x="1100" y="502" width="380" height="136" rx="9" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.4"/>
<text x="1112.0" y="526.5" font-size="12.5" text-anchor="start" fill="#1a1a1a" font-weight="700">Wispstage stage library, started by Wispstage.install()</text>
<text x="1112.0" y="542.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">keeps windows beneath the wallpaper</text>
<text x="1112.0" y="558.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">stops the app from activating or taking key focus</text>
<text x="1112.0" y="574.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">delivers key events to the key window</text>
<text x="1112.0" y="590.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">carries out clicks, drags, hovers and scrolls in-process</text>
<text x="1112.0" y="606.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">silences beeps for unhandled keys and reports them</text>
<text x="1112.0" y="622.5" font-size="12.5" text-anchor="start" fill="#1a1a1a">keeps your real clicks away from the app's global monitors</text>
<rect x="1100" y="666" width="380" height="48" rx="9" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.4"/>
<text x="1290.0" y="686.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" font-weight="700">App windows</text>
<text x="1290.0" y="702.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">beneath the wallpaper, never key</text>
<rect x="1100" y="742" width="380" height="46" fill="#ffffcc" stroke="#cccc00"/>
<text x="1290.0" y="761.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a">Your release app is another target</text>
<text x="1290.0" y="777.1" font-size="11.5" text-anchor="middle" fill="#1a1a1a">and links no Wispstage code.</text>
<rect x="40" y="816" width="1460" height="64" rx="9" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.4"/>
<text x="770.0" y="844.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a" xml:space="preserve"><tspan font-weight="700">Foreground mode (levels 0 and 1, no test host needed):</tspan><tspan> the app comes to the front, and clicks and keys are real system events that move your cursor.</tspan></text>
<text x="770.0" y="860.5" font-size="12.5" text-anchor="middle" fill="#1a1a1a">Accessibility, screenshots and checks work the same way. The stage library, if linked, only reports events. A foreground run holds the global lock exclusively.</text>
<text x="335.0" y="221.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">swift run</text>
<text x="175.0" y="405.0" font-size="11.5" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">reads summary.txt first</text>
<text x="778.0" y="130.0" font-size="11.5" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">file lock (flock)</text>
<text x="335.0" y="599.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">per-step files</text>
<text x="335.0" y="740.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">writes</text>
<text x="1298.0" y="656.0" font-size="11.5" text-anchor="start" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">hides</text>
<text x="960.0" y="360.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">launches it with WISPSTAGE_STAGE=1</text>
<text x="960.0" y="394.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Accessibility: read the UI tree,</text>
<text x="960.0" y="408.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">press, set values, pick menu items</text>
<text x="960.0" y="442.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">optional command channel:</text>
<text x="960.0" y="456.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">stdin commands, stdout events and replies</text>
<text x="960.0" y="516.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">key events to the app's process</text>
<text x="960.0" y="530.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(postToPid)</text>
<text x="960.0" y="580.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">Unix socket: pointer commands to the app,</text>
<text x="960.0" y="594.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">beeps and key-window events back</text>
<text x="960.0" y="670.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">window screenshots</text>
<text x="960.0" y="684.0" font-size="11.5" text-anchor="middle" fill="#222" stroke="#ffffff" stroke-width="4" paint-order="stroke" stroke-linejoin="round">(screencapture -l)</text>
</svg>
